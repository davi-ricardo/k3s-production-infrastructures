apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi-app
  template:
    metadata:
      labels:
        app: glpi-app
    spec:
      containers:
        - name: glpi-app
          image: glpi/glpi:11.0.6
          imagePullPolicy: IfNotPresent
          env:
            - name: TIMEZONE
              value: "America/Sao_Paulo"
            - name: PHP_MEMORY_LIMIT
              value: "512M"
            - name: GLPI_DB_HOST
              value: "glpi-db"
            - name: GLPI_DB_NAME
              value: "glpidb"
            - name: GLPI_DB_USER
              value: "glpiuser"
            - name: GLPI_DB_PASSWORD
              value: "<SECRET>"
          volumeMounts:
            - name: config-data
              mountPath: /var/glpi/config
            - name: files-data
              mountPath: /var/glpi/files
            - name: marketplace-data
              mountPath: /var/www/glpi/marketplace
      volumes:
        - name: config-data
          hostPath:
            path: /opt/glpi/glpi-prod/config
        - name: files-data
          hostPath:
            path: /opt/glpi/glpi-prod/files
        - name: marketplace-data
          hostPath:
            path: /opt/glpi/glpi-prod/marketplace